<title>Brick Breaker</title>
<style>
:root{--g:#5cb948;--ui:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;max-width:100%;aspect-ratio:340/600;container-type:inline-size;font-family:var(--ui)} /* width set by fit(); 1cqw = 1% of it */
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none} /* only the playfield blocks pinch-zoom */#bg{background:#000}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
/* Feedback on press, instantly, no overshoot */
button:active:not(:disabled){transform:scale(.95);transition:transform .1s ease-out}
/* Toolbar: round 44px+ icon chips over the playfield */
.chip{position:absolute;bottom:2cqw;width:12cqw;height:12cqw;min-width:40px;min-height:40px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.1);border-radius:50%;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);color:#e6e6e6}
.chip svg{width:52%;height:52%}#mute .off,#mute[aria-pressed=true] .on{display:none}#mute[aria-pressed=true] .off{display:inline}
#mute{left:2cqw}#settings{left:16cqw}#stats,#pause{right:2cqw}
#go{position:absolute;bottom:2cqw;left:50%;translate:-50% 0;height:12cqw;min-height:40px;padding:0 7cqw;border:0;border-radius:6cqw;background:var(--g);color:#06210a;font-weight:700;font-size:4.4cqw}
#hud{position:absolute;inset:0 0 auto;display:flex;padding:1.2cqw 2cqw;font:600 3.4cqw var(--mono);color:#ddd;pointer-events:none}
#hud span{flex:1}#hLevel{text-align:center}#hLives{text-align:end;color:#ff6b6b;letter-spacing:.1em}
#hint{position:absolute;top:73%;width:100%;margin:0;text-align:center;font:800 6.2cqw var(--mono);color:#fff;pointer-events:none}
/* Level select: real buttons (VoiceOver, keyboard, hit testing) */
#menu{position:absolute;inset:0;background:#000;text-align:center}
#menu h1{position:absolute;top:3.3%;width:100%;margin:0;font:800 7.4cqw var(--mono);letter-spacing:.02em;color:var(--g)}
#levels{position:absolute;left:1.5%;top:11.5%;width:97%;display:grid;grid-template-columns:repeat(10,1fr);gap:.8cqw}
#levels button{aspect-ratio:1;padding:0;border:1px solid rgba(255,255,255,.07);border-radius:1.6cqw;background:#1c1c1e;color:#fff;font:600 3.4cqw var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3cqw}
#levels button.next{border:2px solid var(--g);background:#13301a}
#levels button:disabled{background:#0c0c0c;color:#888;cursor:default}
#levels span{font-size:2.3cqw;line-height:1;color:#fd3;min-height:1em;letter-spacing:-.05em}
/* Cards (pause / win / game over): dimming scrim, panel materializes with scale + opacity, no bounce */
#card{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
.panel{width:76%;box-sizing:border-box;padding:6cqw 5.5cqw 5cqw;border:1px solid rgba(255,255,255,.12);border-radius:6cqw;background:rgba(28,28,30,.94);box-shadow:0 18px 50px rgba(0,0,0,.6);color:#f2f2f2;text-align:center;animation:in .24s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:scale(.94)}}
.panel h2{margin:0;font-size:6.4cqw;line-height:1.15;letter-spacing:-.01em;white-space:pre-line}
#cStars{margin:3cqw 0 0;font-size:11cqw;line-height:1;color:#fd3;letter-spacing:.05em}#cStars i{font-style:normal;color:#48484a}
#cInfo{margin:2.5cqw 0 1cqw;font:600 3.6cqw var(--mono);color:#b0b0b0}
.btn{display:block;width:100%;min-height:44px;margin-top:2.6cqw;padding:2.4cqw;border:1px solid rgba(255,255,255,.14);border-radius:3.2cqw;background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:4.3cqw}
.btn.primary{border-color:var(--g);background:var(--g);color:#06210a}.btn.danger{color:#ff6b6b}
/* Settings sheet */
dialog{width:min(86vw,320px);box-sizing:border-box;padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(28,28,30,.97);color:#f2f2f2;font:15px var(--ui)}
dialog[open]{animation:in .24s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
dialog .btn{font-size:16px;margin-top:10px;padding:10px}
#opts button{display:flex;justify-content:space-between;align-items:center;gap:20px;width:100%;min-height:44px;margin:0;padding:0 2px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);text-align:start}
#opts b{color:var(--g);font-weight:600}#opts b.off{color:#8e8e93}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.panel,dialog[open]{animation:fade .15s}@keyframes fade{from{opacity:0}}button:active:not(:disabled){transform:none}}
@media (prefers-reduced-transparency:reduce){#card,dialog::backdrop{backdrop-filter:none;background:rgba(0,0,0,.8)}.chip{backdrop-filter:none;background:#1c1c1e}}
[hidden]{display:none!important}
</style>
<div id="wrap"><canvas id="bg" aria-hidden="true"></canvas><canvas id="c" role="img" data-tl="gameField"></canvas>
  <div id="hud" hidden><span id="hScore"></span><span id="hLevel"></span><span id="hLives" role="img"></span></div>

</dialog>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=340,H=600; // logical size; see fit()
const $=id=>document.getElementById(id),muteBtn=$('mute'),statsBtn=$('stats'),pauseBtn=$('pause'),wrap=$('wrap'),menuEl=$('menu'),levelsEl=$('levels'),sayEl=$('say'),
  hud=$('hud'),hScore=$('hScore'),hLevel=$('hLevel'),hLives=$('hLives'),hint=$('hint'),cardEl=$('card'),cTitle=$('cTitle'),cStars=$('cStars'),cInfo=$('cInfo'),cBtns=$('cBtns');
const say=t=>{sayEl.textContent=t}; // spoken by VoiceOver through the aria-live region
const COLS=56,P=6,GX=2,GY=22,PAD_W=60,SPEED=280,MAX_BALLS=20;

// Level maps: . empty, 1 green, 2 two-hit, # steel (unbreakable). 56 columns of 5px bricks.
// 100 levels are generated deterministically from the level number: 5 templates in rotation,
// every 12th level a hand-drawn set piece, difficulty (rows, two-hit share, canal width) from the index.
const rng=s=>()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const make=(rows,f)=>Array.from({length:rows},(_,r)=>Array.from({length:COLS},(_,c)=>f(r,c)).join(''));
const cells=m=>m.map(s=>[...s]),join=g=>g.map(r=>r.join(''));
// Sealed steel frame packed with bricks. The only way in is a canal, a steel-walled channel open at
// the bottom edge; the ball flies up it and eats the field from inside. canals: [col, width, height].
function field(rows,canals){
  const g=cells(make(rows,(r,c)=>r<2||r>=rows-2||c<2||c>=COLS-2?'#':'1'));
  for(const[c0,w,h]of canals)for(let r=rows-h;r<rows;r++)for(let c=c0-2;c<c0+w+2;c++)g[r][c]=c<c0||c>=c0+w?'#':'.';
  return join(g);
}
// Carve a steel room (cols 14-41, rows 4..R/3-ish) into a brick grid, door at the bottom centre.
const room=(g,R)=>{const b=R-(R/3|0)-3;for(let r=4;r<b;r++)for(let c=14;c<42;c++)if(r<6||r>=b-2||c<16||c>=40)g[r][c]=r>=b-2&&c>=26&&c<30?'.':'#';return g};
const TEMPLATES=[
  // 1-3 canals, more as levels go up, random heights
  (i,R,d)=>{const n=1+(i/35|0),w=d.canal,slot=COLS/n;return field(R,Array.from({length:n},(_,k)=>[Math.min(COLS-6-w,Math.max(6,Math.round(slot*k+slot/2-w/2+(d.r()-.5)*6))),w,8+(d.r()*(R-16)|0)]))}, // keep >=2 brick columns between a wall and the frame
  // solid block with random holes punched out
  (i,R,d)=>{const g=cells(make(R,()=>'1'));for(let k=0;k<4+i/5;k++){const h=2+(d.r()*3|0),w=2+(d.r()*5|0),r0=d.r()*(R-h)|0,c0=d.r()*(COLS-w)|0;for(let r=r0;r<r0+h;r++)for(let c=c0;c<c0+w;c++)g[r][c]='.'}return join(g)},
  // brick bands separated by staggered steel rows with gaps
  (i,R,d)=>{const off=d.r()<.5?0:4;return make(R,(r,c)=>r%8===7?((c+off+(r/8|0)*4)%8<4?'#':'.'):'1')},
  // a canal field with an inner steel room whose only door is at its bottom
  (i,R,d)=>join(room(cells(field(R,[[26,d.canal,R/3|0]])),R)),
  // diamond with a two-hit core
  (i,R,d)=>make(R,(r,c)=>{const k=Math.abs(c-27.5)/27.5+Math.abs(r-(R-1)/2)/((R-1)/2);return k>1?'.':k>.5?'1':'2'}),

// Hand-drawn 14-column maps, scaled 4x onto the 56-column grid.
const scale=m=>m.trim().split('\n').flatMap(r=>Array(4).fill([...r].map(ch=>ch.repeat(4)).join('')));

const diff=i=>({rows:28+(36*i/99|0),two:.4*i/99,canal:i<30?4:3,r:rng(i+1)});
const LEVELS=Array.from({length:100},(_,i)=>{
  const d=diff(i),m=i===99?join(room(cells(field(64,[[7,3,20],[27,3,14],[46,3,26]])),64)) // finale: tallest field, three canals, inner room
    :i%12===11?SET[(i/12|0)%SET.length]:TEMPLATES[i%TEMPLATES.length](i,d.rows,d);
  return m.map(row=>[...row].map(ch=>ch==='1'&&d.r()<d.two?'2':ch).join(''));
});

// Power-ups: label -> [pill color, effect]. Orange ones are bad.
const POWERS={
  x3:['#5c3',()=>{for(const b of[...balls])split(b,2)}],
  '+3':['#3cf',()=>balls[0]&&split(balls[0],3)],
  '+1':['#fd3',()=>lives=Math.min(lives+1,5)],
  W:['#3cf',()=>{pad.w=90;fx.pad=8}],
  F:['#f44',()=>fx.fire=6],
  S:['#3cf',()=>{setSpeed(200);fx.speed=8}],
  N:['#f80',()=>{pad.w=40;fx.pad=8}],
  '>>':['#f80',()=>{setSpeed(380);fx.speed=8}],
},PK=Object.keys(POWERS);

const cfg=Object.assign({music:true,sfx:true,haptics:true,shake:true,paddle:0,assist:false,lang:'auto'},JSON.parse(localStorage.bb_cfg||'{}')),dlg=document.getElementById('cfg');

const unlocked=i=>i===0||stars[i-1]>0;

// Settings dialog: toggles persist in localStorage; reset clears progress (through the shell on iOS).
// Nothing half-visible behind the modal dialog; tied to its own open/close, not to the (possibly stopped) loop.
document.getElementById('settings').onclick=()=>{dlg.showModal();wrap.style.visibility='hidden'};
dlg.onclose=()=>{wrap.style.visibility=''};
// Each setting is one full-width 44px button: role=switch for on/off, a cycling button for paddle mode and language.
const PADS=[0,1,1.5,2],saveCfg=()=>{localStorage.bb_cfg=JSON.stringify(cfg)},optShow=[];
const cycle=(list,v)=>list[(list.indexOf(v)+1)%list.length];
$('opts').append(...['music','sfx','haptics','shake','paddle','assist','lang'].filter(k=>k!=='haptics'||inApp()).map(k=>{
  const b=document.createElement('button');b.type='button';
  const show=()=>{const v=cfg[k],name=t(k==='lang'?'language':k);
    if(k==='paddle'||k==='lang'){const val=k==='paddle'?(v?t('drag',v):t('follow')):LANG_NAMES[v]||t('auto');b.innerHTML=`<span>${name}</span><b>${val}</b>`;b.setAttribute('aria-label',`${name}, ${val}`)}
    else{b.setAttribute('role','switch');b.setAttribute('aria-checked',String(v));b.innerHTML=`<span>${name}</span><b class="${v?'':'off'}" aria-hidden="true">${t(v?'on':'off')}</b>`}};
  b.onclick=()=>{cfg[k]=k==='paddle'?cycle(PADS,cfg[k]):k==='lang'?cycle(LANG_KEYS,cfg[k]):!cfg[k];saveCfg();k==='lang'?applyLang():show()};
  optShow.push(show);show();return b;
}));
const resetBtn=document.getElementById('reset');let armed=0;
resetBtn.onclick=()=>{
  if(!armed){resetBtn.textContent=t('confirmReset');armed=setTimeout(()=>{armed=0;resetBtn.textContent=t('reset')},3000);return}
  clearTimeout(armed);if(inApp())native({type:'reset'});else{delete localStorage.bb_stars;delete localStorage.bb_best;location.reload()}
};
addEventListener('resize',()=>{fit();for(let i=0;i<grid.length;i++)paint(i)});

let last=0;
// The loop only runs while a level is on screen; the menu is static HTML, so it stops there (battery).
let running=false;
function loop(now){const dt=last?Math.min((now-last)/1000,1/30):0;last=now;update(dt);draw();if(state==='menu'||state==='pause'){running=false;return}requestAnimationFrame(loop)}
function wake(){if(!running){running=true;last=0;requestAnimationFrame(loop)}}
// Language: the setting, else the iOS shell's language (window.nativeLang), else the browser's; unknown -> English.
function applyLang(){
  const want=cfg.lang!=='auto'?cfg.lang:String(globalThis.nativeLang||globalThis.navigator?.language||'en').slice(0,2).toLowerCase();
  lang=I18N[want]?want:'en';
  const root=document.documentElement;root.lang=lang;root.dir=lang==='fa'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});
  document.querySelectorAll('[data-tl]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.tl)));
  optShow.forEach(f=>f());resetBtn.textContent=t('reset');hudLives=-1;
  if(state==='menu')goMenu();else if(cardKind)showCard(cardKind);else draw();
}
applyLang(); // first render: builds the menu in the right language
try{navigator.serviceWorker?.register('sw.js')}catch{}
</script>
</html>
